services:

  techos:
    build: .
    container_name: techos
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REGISTER_SECRET: ${REGISTER_SECRET}
      PORT: 3001
    depends_on:
      techos-db:
        condition: service_healthy

  techos-db:
    image: postgres:16-alpine
    container_name: techos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: techos
      POSTGRES_USER: techos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - techos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techos -d techos"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  techos-db-data:
